<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Dakini lifecycle fixture</title></head>
<body><div id="root"></div><script type="module">
const contexts=[];
const Original=window.AudioContext;
window.AudioContext=new Proxy(Original,{construct(Target,args){const context=new Target(...args);contexts.push(context);return context;}});
await import('./main.tsx');
setInterval(()=>parent.postMessage({source:'dakini-test',report:'Contexts created: '+contexts.length+'; states: '+contexts.map(c=>c.state).join(', ')+'; surface active: '+document.documentElement.dataset.surfaceActive},location.origin),500);
</script></body></html>
